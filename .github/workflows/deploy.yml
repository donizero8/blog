name: CI and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: blog_test
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d blog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DEBUG: "0"
      SECRET_KEY: github-actions-test-secret-key-only-not-for-production-2026
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: blog_test
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: test-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q config blog manage.py

      - name: Check Django
        run: python manage.py check

      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

      - name: Validate production Compose
        run: |
          cp .env.production.example .env
          docker compose -f compose.prod.yaml config --quiet

  deploy:
    name: Deploy to DigitalOcean
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          PROJECT_PATH: ${{ vars.PROJECT_PATH }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "$DROPLET_USER@$DROPLET_HOST" \
            "PROJECT_PATH='$PROJECT_PATH' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          cd "$PROJECT_PATH"

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          docker compose \
            --env-file .env \
            -f compose.prod.yaml \
            config --quiet

          docker compose \
            --env-file .env \
            -f compose.prod.yaml \
            up --build -d --remove-orphans

          docker compose \
            --env-file .env \
            -f compose.prod.yaml \
            exec -T web \
            python manage.py check --deploy

          docker compose \
            --env-file .env \
            -f compose.prod.yaml \
            ps
          REMOTE

      - name: Verify production website
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 5 \
            "https://$DOMAIN/" \
            > /dev/null
