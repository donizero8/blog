{% extends "base.html" %}
{% load static %}
{% block content %}
<section class="hero"><h1>{{ site_profile.hero_title }}</h1><p>{{ site_profile.hero_description }}</p></section>
<div id="post-list" data-post-list>{% include "blog/_post_cards.html" %}</div>
{% if page.has_next %}
  <div class="load-more-wrap">
    <a class="load-more" href="?page={{ page.next_page_number }}" data-load-more data-next-page="{{ page.next_page_number }}">Muat lebih banyak</a>
    <p class="load-more-status" data-load-status role="status" aria-live="polite"></p>
  </div>
{% endif %}
{% endblock %}
{% block extra_js %}<script src="{% static 'blog/load-more.js' %}" defer></script>{% endblock %}
