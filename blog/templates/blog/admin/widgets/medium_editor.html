<div class="medium-editor medium-editor-{{ widget.variant }}" data-medium-editor>
  <div class="medium-toolbar" role="toolbar" aria-label="Format tulisan">
    <button type="button" data-block="p" title="Paragraf">P</button>
    <button type="button" data-block="h2" title="Judul besar">H2</button>
    <button type="button" data-block="h3" title="Judul kecil">H3</button>
    <span></span>
    <button type="button" data-command="bold" title="Tebal"><strong>B</strong></button>
    <button type="button" data-command="italic" title="Miring"><em>I</em></button>
    <button type="button" data-command="createLink" title="Tautan">↗</button>
    <button type="button" data-command="formatBlock" data-value="blockquote" title="Kutipan">“</button>
    <button type="button" data-command="insertUnorderedList" title="Daftar">•</button>
    <button type="button" data-code title="Blok kode">&lt;/&gt;</button>
    <button type="button" class="medium-image-button" data-image title="Sisipkan gambar" aria-label="Sisipkan gambar">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <circle cx="8.5" cy="9" r="1.5"></circle>
        <path d="m4 17 4.5-4.5 3.5 3 2.5-2.5L20 18"></path>
      </svg>
    </button>
  </div>
  <div class="medium-image-controls" data-image-controls hidden aria-label="Ukuran gambar">
    <span>Ukuran:</span>
    <button type="button" data-image-size="small">Kecil</button>
    <button type="button" data-image-size="medium">Sedang</button>
    <button type="button" data-image-size="large">Besar</button>
    <button type="button" data-image-remove>Hapus</button>
  </div>
  <div class="medium-canvas" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Ceritakan sesuatu…">{{ widget.value|default_if_none:""|safe }}</div>
  <textarea name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>{{ widget.value|default_if_none:"" }}</textarea>
  <p class="medium-hint"><kbd>⌘/Ctrl + Enter</kbd> untuk masuk/keluar blok kode. Tekan <kbd>Esc</kbd> atau Enter dua kali untuk kembali ke paragraf.</p>
  <dialog class="medium-image-dialog" data-image-dialog>
    <div class="medium-dialog-body">
      <div class="medium-dialog-header"><h3>Sisipkan gambar</h3><button type="button" data-image-cancel aria-label="Tutup">×</button></div>
      <label>File gambar<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" data-image-file></label>
      <div class="medium-image-source-divider"><span>atau</span></div>
      <label>URL gambar<input type="url" inputmode="url" data-image-url placeholder="https://example.com/image.jpg"></label>
      <label>Teks alternatif<input type="text" maxlength="180" data-image-alt placeholder="Jelaskan isi gambar"></label>
      <label>Ukuran tampilan
        <select data-image-initial-size>
          <option value="small">Kecil</option>
          <option value="medium" selected>Sedang</option>
          <option value="large">Besar</option>
        </select>
      </label>
      <p class="medium-upload-status" data-image-status role="status" aria-live="polite"></p>
      <div class="medium-dialog-actions"><button type="button" data-image-cancel>Batal</button><button type="button" data-image-upload>Sisipkan gambar</button></div>
    </div>
  </dialog>
  <span data-image-upload-url="{% url 'admin:blog_post_upload_image' %}" hidden></span>
</div>
